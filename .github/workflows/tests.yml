name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx jest --ci

      # Coverage badges are only regenerated/committed on main itself, not on PR branches
      # (PRs from forks get a read-only GITHUB_TOKEN, so a push here would fail anyway).
      - name: Update coverage badges in README
        if: github.event_name == 'push'
        run: npx istanbul-badges-readme

      - name: Commit updated badges
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "Update coverage badges [skip ci]" && git push)

      - name: Upload coverage HTML report
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage

  deploy-coverage:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
